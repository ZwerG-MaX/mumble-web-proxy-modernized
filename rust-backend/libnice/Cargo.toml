[package]
name = "libnice"
version = "0.4.0"
authors = ["Jonas Herzig <me@johni0702.de>", "Modernized for Rust 1.88+"]
edition = "2021"
rust-version = "1.88"
description = "Safe, high-level Rust bindings to libnice"
license = "LGPL-2.1 OR MPL-1.1"
repository = "https://github.com/ZwerG-MaX/rust-libnice"

[dependencies]
libnice-sys = { path = "../libnice-sys" }
libc = "0.2"
glib-sys = "0.20"
gobject-sys = "0.20"
glib = "0.20"
futures = "0.3"
webrtc-sdp = "0.4"

[dev-dependencies]
tokio = { version = "1.42", features = ["rt"] }
