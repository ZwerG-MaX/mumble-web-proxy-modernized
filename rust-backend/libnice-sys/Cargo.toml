[package]
name = "libnice-sys"
version = "0.5.0"
authors = ["Jonas Herzig <me@johni0702.de>", "Modernized for Rust 1.88+"]
edition = "2021"
rust-version = "1.88"
links = "nice"
description = "Rust FFI bindings to libnice, automatically generated with bindgen"
license = "LGPL-2.1 OR MPL-1.1"
repository = "https://github.com/ZwerG-MaX/rust-libnice-sys"

[dependencies]
gio-sys = "0.20"
gobject-sys = "0.20"
glib-sys = "0.20"
libc = "0.2"

[build-dependencies]
bindgen = "0.70"
pkg-config = "0.3"
