[workspace]
resolver = "2"
members = [
    "mumble-protocol",
    "rtp",
    "proxy",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
authors = ["Modernized mumble-web-proxy"]
license = "AGPL-3.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "net"] }
futures = "0.3"

# Serialization
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Networking
bytes = "1.9"
byteorder = "1.5"

# TLS
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.2"

# WebSocket
tokio-tungstenite = "0.24"
tungstenite = "0.24"
http = "1.2"

# WebRTC & ICE
libnice = "0.4"
webrtc-sdp = "0.4"

# Cryptography
openssl = "0.10"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
